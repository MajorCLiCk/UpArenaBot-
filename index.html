<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="color-scheme" content="light dark">
<title>UPARENA</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Тема целиком берётся у Telegram: telegram-web-app.js выставляет --tg-theme-* и обновляет их при смене темы */
:root{
  --bg:var(--tg-theme-bg-color,#fff);
  --bg2:var(--tg-theme-secondary-bg-color,#f2f2f7);
  --sec:var(--tg-theme-section-bg-color,var(--bg));
  --tx:var(--tg-theme-text-color,#000);
  --hint:var(--tg-theme-hint-color,#8a8a8f);
  --sub:var(--tg-theme-subtitle-text-color,var(--hint));
  --link:var(--tg-theme-link-color,#2481cc);
  --acc:var(--tg-theme-accent-text-color,var(--link));
  --btn:var(--tg-theme-button-color,#2481cc);
  --btx:var(--tg-theme-button-text-color,#fff);
  --sh:var(--tg-theme-section-header-text-color,var(--hint));
  --sep:var(--tg-theme-section-separator-color,rgba(128,128,128,.28));
  --dest:var(--tg-theme-destructive-text-color,#ff3b30);
  --bar:var(--tg-theme-bottom-bar-bg-color,var(--bg));
  --ok:#31b545;--fill:rgba(120,120,128,.16);--r:12px;--tabh:56px;
  --sat:calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px));
  --sab:var(--tg-safe-area-inset-bottom,env(safe-area-inset-bottom,0px));
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg2);color:var(--tx);overflow:hidden;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;
  font:400 16px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;text-align:inherit}
input{-webkit-user-select:text;user-select:text}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--btn);outline-offset:2px}

/* иконки */
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.st{stroke:none;width:.9em;height:.9em;margin-left:.18em;vertical-align:-.1em}
.i.chev{width:16px;height:16px;color:var(--hint);opacity:.75}
.i.s20{width:20px;height:20px}

/* каркас */
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#view{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  padding:calc(var(--sat) + 6px) 0 calc(var(--tabh) + var(--sab) + 28px)}
#view.notabs{padding-bottom:calc(var(--sab) + 28px)}
body.mbf #view,body.mbf #battle{padding-bottom:calc(var(--sab) + 96px)}
.enter{animation:enter .22s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* нижняя навигация как в Telegram */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;padding:0 4px var(--sab);background:var(--bar);border-top:.5px solid var(--sep)}
#tabs button{flex:1;height:var(--tabh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:500;color:var(--hint);text-align:center;transition:color .15s}
#tabs button.on{color:var(--acc)}
#tabs button:active .i{transform:scale(.9)}

/* заголовок страницы */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 20px 14px}
.top h1{font-size:30px;font-weight:700;letter-spacing:-.01em;line-height:1.1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-flex;align-items:center;padding:7px 13px;border-radius:99px;background:var(--sec);font-size:15px;font-weight:600;white-space:nowrap;flex:none}

/* группы и ячейки (как списки настроек Telegram) */
.sec{background:var(--sec);border-radius:var(--r);margin:0 16px;overflow:hidden}
.sec+.sec,.sec+.stats,.stats+.sec{margin-top:16px}
.sh{margin:24px 32px 7px;font-size:13px;line-height:1.2;text-transform:uppercase;letter-spacing:.02em;color:var(--sh)}
.sf{margin:8px 32px 0;font-size:13px;line-height:1.35;color:var(--hint)}
.cell{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:8px 16px;position:relative}
.cell+.cell:before{content:"";position:absolute;top:0;right:0;left:16px;height:.5px;background:var(--sep)}
.ins .cell+.cell:before{left:68px}
.ins.rkl .cell+.cell:before{left:104px}
.cell .gr{flex:1;min-width:0}
.cell .t{display:block;font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .s{display:block;margin-top:2px;font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .v{font-size:16px;font-weight:600;white-space:nowrap}
.tap{cursor:pointer;transition:background .12s}
.tap:active{background:var(--fill)}
.ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;color:#fff;background:var(--c,var(--btn))}
.ico.r{border-radius:50%}
.ico .i{width:20px;height:20px}
.dest{color:var(--dest)}
.pos{color:var(--ok)}.neg{color:var(--dest)}.mu{color:var(--hint)}
.av{display:block;flex:none;border-radius:50%;overflow:hidden}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;line-height:1.4;background:var(--fill);color:var(--hint);white-space:nowrap;vertical-align:1px}
.badge.g{background:rgba(49,181,69,.16);color:var(--ok)}
.badge.c{background:rgba(36,129,204,.16);color:var(--link)}

/* кнопки */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;width:100%;height:50px;padding:0 20px;border-radius:var(--r);
  background:var(--btn);color:var(--btx);font-size:17px;font-weight:600;transition:opacity .15s,transform .1s}
.btn:active{opacity:.8;transform:scale(.985)}
.btn.sm{width:auto;height:34px;padding:0 14px;font-size:15px;border-radius:99px;flex:none}
.btn.soft{background:var(--fill);color:var(--btn)}
.btn[disabled]{opacity:.4;pointer-events:none}

/* выбор значений */
.opts{display:grid;gap:8px;padding:12px}
.opts.c3{grid-template-columns:repeat(3,1fr)}
.opts.c5{grid-template-columns:repeat(5,1fr)}
.opt{height:46px;border-radius:10px;background:var(--fill);border:2px solid transparent;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;transition:border-color .12s,background .12s}
.opt.on{border-color:var(--btn);background:var(--fill)}
.seg{display:flex;gap:2px;margin:0 16px;padding:2px;border-radius:9px;background:var(--fill)}
.seg button{flex:1;height:32px;border-radius:7px;font-size:14px;font-weight:500;text-align:center;transition:background .15s}
.seg button.on{background:var(--sec);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.chips{display:flex;gap:8px;padding:0 16px 2px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 14px;border-radius:99px;background:var(--sec);font-size:14px;font-weight:500;display:inline-flex;align-items:center;transition:background .15s}
.chip.on{background:var(--btn);color:var(--btx)}
.field{flex:1;min-width:0;height:40px;padding:0 12px;border:0;border-radius:10px;background:var(--fill);color:var(--tx);font:inherit;font-size:16px;letter-spacing:.08em;text-transform:uppercase;outline:0}
.field::placeholder{color:var(--hint);letter-spacing:0;text-transform:none}

/* главная / кошелёк */
.hero{padding:22px 16px 20px;text-align:center}
.hero small{display:block;font-size:14px;color:var(--hint)}
.hero b{display:block;margin:4px 0 0;font-size:44px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.acts{display:flex;justify-content:center;gap:10px;margin-top:18px}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;width:84px;font-size:12px;font-weight:500;color:var(--acc);text-align:center}
.act .ci{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--btn);color:var(--btx);transition:transform .1s}
.act:active .ci{transform:scale(.92)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 16px}
.stat{padding:12px 6px;border-radius:var(--r);background:var(--sec);text-align:center}
.stat b{display:block;font-size:19px;font-weight:700;white-space:nowrap}
.stat small{display:block;margin-top:2px;font-size:12px;color:var(--hint)}
.empty{padding:26px 20px;text-align:center;color:var(--hint);font-size:15px;line-height:1.4}
.empty b{display:block;color:var(--tx);font-size:16px;font-weight:600;margin-bottom:2px}
.rk{width:24px;text-align:center;font-weight:700;color:var(--hint);flex:none}
.rk.m1{color:#e8a710}.rk.m2{color:#9aa1ac}.rk.m3{color:#c07a4a}
.me{background:var(--fill)}
.prof{display:flex;flex-direction:column;align-items:center;gap:4px;padding:24px 16px}
.prof h2{margin-top:8px;font-size:22px;font-weight:700}
.prof small{color:var(--hint);font-size:13px}

/* вход / загрузка */
.gate{min-height:calc(100vh - 120px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:40px 32px;text-align:center}
.gate .logo{width:92px;height:92px;border-radius:26px;display:grid;place-items:center;color:#fff;margin-bottom:10px;background:linear-gradient(160deg,#37aee2,#1e96c8)}
.gate .logo .i{width:48px;height:48px;stroke-width:1.6}
.gate h2{font-size:22px;font-weight:700}
.gate p{max-width:300px;font-size:15px;line-height:1.4;color:var(--hint)}
.gate small{max-width:300px;font-size:12px;line-height:1.4;color:var(--hint);opacity:.85}
.gate .btn{width:auto;min-width:180px;margin-top:10px}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--fill);border-top-color:var(--btn);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* арена */
#battle{position:fixed;inset:0;z-index:20;overflow-y:auto;overscroll-behavior:contain;background:var(--bg2);padding:calc(var(--sat) + 6px) 0 calc(var(--sab) + 28px)}
.bhead{display:flex;align-items:center;gap:12px;padding:6px 20px 14px}
.bhead .gr{flex:1;min-width:0}
.bhead h1{font-size:26px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bhead small{display:block;margin-top:2px;font-size:13px;color:var(--hint)}
.ibtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--sec);color:var(--acc)}
.bback{display:none}body.nobb .bback{display:grid}
.board{position:relative;width:min(calc(100% - 32px),56vh);aspect-ratio:1;margin:0 auto;border-radius:20px;overflow:hidden;background:#10131a;box-shadow:0 0 0 .5px var(--sep)}
.board svg#arena{width:100%;height:100%;display:block}
#ov{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none;color:#fff}
#ov .t{margin-top:30%;padding:0 24px;font-size:19px;font-weight:600;text-shadow:0 1px 12px rgba(0,0,0,.6)}
#ov .n{font-size:120px;font-weight:700;line-height:1;text-shadow:0 0 40px rgba(42,171,238,.9);animation:pop 1s ease-out infinite}
#ov .w{padding:20px 26px;border-radius:20px;background:rgba(16,19,26,.82);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 0 0 .5px rgba(255,255,255,.18);animation:pop .5s ease-out}
#ov .w small{display:block;font-size:13px;color:rgba(255,255,255,.65)}
#ov .w h3{margin:4px 0 6px;font-size:24px;font-weight:700}
@keyframes pop{0%{transform:scale(1.5);opacity:0}30%{opacity:1}100%{transform:scale(1)}}
.dead{opacity:.45}.dead .t{text-decoration:line-through}
.hp{letter-spacing:2px;font-size:11px}

/* всплывающее сообщение и запасная главная кнопка */
#toast{position:fixed;left:50%;bottom:calc(var(--tabh) + var(--sab) + 16px);z-index:60;max-width:calc(100% - 32px);padding:10px 16px;border-radius:14px;background:rgba(32,32,34,.94);color:#fff;font-size:14px;font-weight:500;line-height:1.3;text-align:center;
  transform:translate(-50%,16px);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.err{background:rgba(222,49,38,.96)}
#mbf{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 16px calc(var(--sab) + 10px);background:var(--bar);border-top:.5px solid var(--sep)}

/* оттенки через color-mix, если поддерживается */
@supports (background:color-mix(in srgb,red 10%,transparent)){
  .opt.on{background:color-mix(in srgb,var(--btn) 14%,transparent)}
  .btn.soft{background:color-mix(in srgb,var(--btn) 14%,transparent)}
  .me{background:color-mix(in srgb,var(--btn) 9%,transparent)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>

<script type="text/plain" id="src-functions">/* UPARENA — серверная часть (Firebase Cloud Functions v2, Node 22).
   Сервер — единственный источник истины: баланс, ставки, старт и результат матча.
   Деплой: firebase deploy --only functions,firestore:rules
   Секреты: firebase functions:secrets:set BOT_TOKEN ; firebase functions:secrets:set WEBHOOK_SECRET */
const { onCall, onRequest, HttpsError } = require('firebase-functions/v2/https');
const { onSchedule } = require('firebase-functions/v2/scheduler');
const { defineSecret } = require('firebase-functions/params');
const admin = require('firebase-admin');
const crypto = require('crypto');

admin.initializeApp();
const db = admin.firestore(), FV = admin.firestore.FieldValue;
const BOT = defineSecret('BOT_TOKEN'), HOOK = defineSecret('WEBHOOK_SECRET');
const FEE = 0.05, STAKES = [10, 50, 100, 250, 500, 1000], MAXP = [2, 4, 6, 8, 10], DEPS = [50, 100, 250, 500, 1000];

/* ---- Движок: должен совпадать с клиентским байт-в-байт по логике ---- */
function mul(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
class Engine {
  constructor(seed, n) {
    this.rng = mul(seed); this.n = n; this.x = 500; this.y = 500; this.sp = 340; this.tick = 0; this.alive = Array(n).fill(true); this.hp = Array(n).fill(3); this.over = false; this.winner = -1; this.ev = [];
    let a = this.rng() * 2 - 1, b = this.rng() * 2 - 1; if (Math.abs(a) + Math.abs(b) < .3) a = 1; this.dir(a, b);
  }
  dir(a, b) { const l = Math.sqrt(a * a + b * b); this.vx = a / l * this.sp; this.vy = b / l * this.sp; }
  hit(p, x, y) {
    const o = Math.min(this.n - 1, Math.floor(p / (4000 / this.n))); this.sp = Math.min(1100, this.sp * 1.05);
    const k = (this.rng() - .5) * .14; this.dir(this.vx - k * this.vy, this.vy + k * this.vx);
    const kill = this.alive[o] && --this.hp[o] <= 0; this.ev.push({ x, y, o, p: this.sp / 1100, kill });
    if (kill) { this.alive[o] = false; if (this.alive.filter(Boolean).length <= 1) { this.over = true; this.winner = this.alive.indexOf(true); } }
  }
  step() {
    if (this.over) return; this.tick++; const dt = 1 / 60, r = 16, W = 1000; this.x += this.vx * dt; this.y += this.vy * dt;
    if (this.y < r) { this.y = r; this.vy = Math.abs(this.vy); this.hit(this.x, this.x, 0); }
    if (this.x > W - r) { this.x = W - r; this.vx = -Math.abs(this.vx); this.hit(W + this.y, W, this.y); }
    if (this.y > W - r) { this.y = W - r; this.vy = -Math.abs(this.vy); this.hit(2 * W + (W - this.x), this.x, W); }
    if (this.x < r) { this.x = r; this.vx = Math.abs(this.vx); this.hit(3 * W + (W - this.y), 0, this.y); }
  }
}

/* ---- Утилиты ---- */
const fail = (c, m) => { throw new HttpsError(c, m); };
const authed = r => r.auth ? r.auth.uid : fail('unauthenticated', 'Требуется вход');
const wk = () => { const d = new Date(); d.setUTCHours(0, 0, 0, 0); d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7)); const y = d.getUTCFullYear(); return y + '-W' + Math.ceil(((d - Date.UTC(y, 0, 1)) / 864e5 + 1) / 7); };
const addTx = (t, uid, type, amount, room) => t.set(db.collection(`users/${uid}/tx`).doc(), { type, amount, room: room || null, ts: FV.serverTimestamp() });
// Идемпотентность: повтор запроса с тем же rid возвращает прежний результат и не списывает дважды
function idem(uid, rid, fn) {
  if (typeof rid !== 'string' || rid.length < 8 || rid.length > 64 || rid.includes('/')) fail('invalid-argument', 'Нет идентификатора запроса');
  const k = db.doc(`requests/${uid}_${rid}`);
  return db.runTransaction(async t => { const s = await t.get(k); if (s.exists) return s.data().res; const res = await fn(t); t.set(k, { res, ts: FV.serverTimestamp() }); return res; });
}
function verify(init, token) {
  const p = new URLSearchParams(init), h = p.get('hash'); p.delete('hash');
  if (!h || !token) return null;
  const s = [...p.entries()].map(([k, v]) => k + '=' + v).sort().join('\n');
  const key = crypto.createHmac('sha256', 'WebAppData').update(token).digest(), c = crypto.createHmac('sha256', key).update(s).digest();
  const hb = Buffer.from(h, 'hex'); // не hex или неверная длина -> отказ (раньше нестандартные символы давали RangeError и ошибку "internal")
  if (hb.length !== c.length || !crypto.timingSafeEqual(c, hb)) return null;
  const age = Date.now() / 1000 - Number(p.get('auth_date'));

/* ---- Расчёт матча: победителя определяет только сервер ---- */
async function settle(id) {

    const rr = db.doc('rooms/' + id), rs = await t.get(rr); if (!rs.exists) return { ok: false };
    const r = rs.data(); if (r.status === 'FINISHED') return { ok: true }; if (r.status !== 'COUNTDOWN') return { ok: false };
    if (Date.now() < r.finishAt) return { early: true };
    const sec = await t.get(rr.collection('secret').doc('result')), w = sec.data().winner;
    const lbs = await Promise.all(r.players.map(p => t.get(db.doc('leaderboard/' + p.uid))));
    const pool = r.stake * r.max, prize = Math.floor(pool * (1 - FEE)), k = wk();
    r.players.forEach((p, i) => {
      const win = i === w, net = win ? prize - r.stake : -r.stake, old = lbs[i].data() || {}, same = old.weekKey === k;
      t.update(db.doc('users/' + p.uid), { games: FV.increment(1), wins: FV.increment(win ? 1 : 0), losses: FV.increment(win ? 0 : 1), earned: FV.increment(net), ...(win ? { stars: FV.increment(prize) } : {}) });
      if (win) addTx(t, p.uid, 'win', prize, id);
      t.set(db.doc('leaderboard/' + p.uid), { name: p.name, photo: p.photo || '', games: (old.games || 0) + 1, wins: (old.wins || 0) + (win ? 1 : 0), earned: (old.earned || 0) + net, weekKey: k, weekEarned: (same ? old.weekEarned || 0 : 0) + net, weekWins: (same ? old.weekWins || 0 : 0) + (win ? 1 : 0) });
    });

    t.set(db.doc('platform/stats'), { fees: FV.increment(pool - prize) }, { merge: true });
    t.update(rr, { status: 'FINISHED', winner: w, prize }); return { ok: true };
  });
}

<script type="text/plain" id="src-rules">rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    function signedIn() { return request.auth != null; }

    // Баланс и профиль: только владелец читает, писать может лишь сервер (Admin SDK обходит правила)
    match /users/{uid} {
      allow read: if signedIn() && request.auth.uid == uid;
      allow write: if false;
      match /tx/{txId} {
        allow read: if signedIn() && request.auth.uid == uid;
        allow write: if false;
      }
    }

    // Публичные комнаты видны всем вошедшим, приватные — только участникам.
    // Запрос в клиенте обязан содержать where('priv','==',false) либо where('playerUids','array-contains',uid).
    match /rooms/{roomId} {
      allow read: if signedIn() && (resource.data.priv == false || request.auth.uid in resource.data.playerUids);
      allow write: if false;
      match /secret/{doc} { allow read, write: if false; }
    }

    match /matches/{id}     { allow read: if signedIn(); allow write: if false; }
    match /leaderboard/{id} { allow read: if signedIn(); allow write: if false; }

    // Всё остальное (requests, payments, platform) закрыто
  }
}

function authError(e){const c=String(e&&e.code||'').replace('functions/',''),m=String(e&&e.message||'');
  if(c==='unauthenticated')return{t:'Сессия устарела',m:'Закройте приложение и откройте его снова из Telegram.',c,retry:true};
  if(c==='unavailable'||c==='deadline-exceeded'||/network|offline|failed to fetch/i.test(m))return{t:'Нет соединения',m:'Проверьте интернет и повторите попытку.',c:c||'network',retry:true};
  if(/^auth\//.test(c))return{t:'Не удалось войти',m:'Telegram подтвердил вас, но сервис входа отклонил токен. Повторите попытку позже.',c,retry:true};
  const own=m&&!/^internal$/i.test(m)?m:'Сервер входа временно недоступен. Повторите попытку позже.';
  return{t:'Не удалось войти',m:own,c:(c||'internal')+' · владельцу: Firebase Console → Functions → Журналы → telegramAuth',retry:true}}

function serverView(){const F=[['src-fix','Если вход не работает (Cloud Shell)'],['src-functions','functions/index.js'],['src-package','functions/package.json'],['src-rules','firestore.rules'],['src-indexes','firestore.indexes.json']];

async function boot(){
  if(location.hash==='#server')return serverView();

  if(!tg||!tg.initData){S.gate={t:'Откройте в Telegram',m:'UPARENA работает только внутри Telegram: откройте приложение через бота.'};return ui(true)}
  try{
    const{token}=await call('telegramAuth',{initData:tg.initData});
    await signInWithCustomToken(auth,token);UID=auth.currentUser.uid;
    try{const t0=Date.now(),{t}=await call('serverTime'),t1=Date.now();OFF=t-(t0+t1)/2}catch(e){OFF=0}

function listen(){
  unsubs.forEach(f=>{try{f()}catch(e){}});
  const L=(q,key,post,after)=>onSnapshot(q,s=>{const a=s.docs.map(d=>({id:d.id,...d.data()}));S[key]=post?post(a):a;after&&after();ui()},e=>console.warn(key,e.code,e.message));

    L(query(collection(db,'rooms'),where('priv','==',false),where('status','in',live)),'rooms'),

    L(query(collection(db,'rooms'),where('playerUids','array-contains',UID),where('status','in',live)),'mine',null,()=>{

    L(query(collection(db,'matches'),orderBy('finishedAt','desc'),limit(10)),'matches'),
    L(query(collection(db,'leaderboard'),orderBy('earned','desc'),limit(20)),'lb'),
    L(query(collection(db,'leaderboard'),where('weekKey','==',wk()),limit(50)),'lbw',a=>a.sort((x,y)=>(y.weekEarned||0)-(x.weekEarned||0))),

/* ---------- Арена (SVG) ---------- */
function pt(p){const W=1000,i=8,c=v=>Math.min(W-i,Math.max(i,v));p=((p%4000)+4000)%4000;return p<W?[c(p),i]:p<2*W?[W-i,c(p-W)]:p<3*W?[c(W-(p-2*W)),W-i]:[i,c(W-(p-3*W))]}
function segD(i,L){const a=i*L,b=(i+1)*L,P=[pt(a)];for(let k=1;k<4;k++)if(k*1000>a&&k*1000<b)P.push(pt(k*1000));P.push(pt(b-.01));return P.map((q,j)=>(j?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join('')}
function arenaSvg(n){const L=4000/n;let sg='',tr='',gr='';for(let i=0;i<n;i++)sg+=`<path d="${segD(i,L)}" fill="none" stroke="${COL[i%10]}" stroke-width="14"/>`;
  for(let j=0;j<18;j++)tr+=`<circle r="${(3+j*.8).toFixed(1)}" cx="500" cy="500" fill="#2AABEE" opacity="${(j/18*.4).toFixed(2)}"/>`;for(let i=1;i<10;i++)gr+=`M${i*100} 0V1000M0 ${i*100}H1000`;
  return`<svg id="arena" viewBox="0 0 1000 1000" role="img" aria-label="Игровая арена"><defs><radialGradient id="hg"><stop offset="0" stop-color="#fff"/><stop offset=".25" stop-color="#2AABEE" stop-opacity=".9"/><stop offset=".6" stop-color="#2AABEE" stop-opacity=".28"/><stop offset="1" stop-color="#2AABEE" stop-opacity="0"/></radialGradient><filter id="gl" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><g id="world"><rect width="1000" height="1000" fill="#10131a"/><path d="${gr}" stroke="rgba(255,255,255,.05)" stroke-width="1.5" fill="none"/><g id="segs" filter="url(#gl)">${sg}</g><g id="trail">${tr}</g><g id="fxg"></g><circle id="halo" r="62" cx="500" cy="500" fill="url(#hg)"/><circle id="core" r="13" cx="500" cy="500" fill="#fff"/></g></svg>`}
function fxBurst(e){if(!A)return;const n=10+Math.round(e.p*24);for(let i=0;i<n&&PT.length<220;i++){const a=Math.random()*6.283,s=2+Math.random()*(4+e.p*8),c=document.createElementNS(NS,'circle');c.setAttribute('fill',Math.random()<.5?COL[e.o%10]:'#fff');A.fx.appendChild(c);PT.push({c,x:e.x,y:e.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,r:3+Math.random()*5})}
  if(e.p>.45||e.kill){SH=Math.max(SH,6+e.p*10);hap(e.kill?'heavy':'light')}}
function confetti(){if(!A)return;for(let i=0;i<90&&PT.length<260;i++){const c=document.createElementNS(NS,'circle');c.setAttribute('fill',COL[i%10]);A.fx.appendChild(c);PT.push({c,x:Math.random()*1000,y:-20,vx:(Math.random()-.5)*3,vy:2+Math.random()*7,l:2.2,r:4+Math.random()*5})}}
const ovKey=r=>{const ph=phase(r);return ph+(ph==='COUNT'?Math.ceil((r.startAt-now())/1000):'')+r.status+r.players.length+(sim?sim.eng.hp.join(''):'')};
function frame(){
  if(!S.rid)return;raf=requestAnimationFrame(frame);const r=S.room;if(!r||!A)return;let x=500,y=500,al=null;
  if(r.seed){if(!sim||sim.seed!==r.seed)sim={seed:r.seed,eng:new Engine(r.seed,r.max),px:500,py:500};
    const e=sim.eng,target=r.status==='FINISHED'?1e9:Math.floor((now()-r.startAt)*.06),lag=target-e.tick;let k=0;
    while(e.tick<target&&!e.over&&k++<20000){sim.px=e.x;sim.py=e.y;e.step();const ev=e.ev.splice(0);if(lag<30)ev.forEach(fxBurst)}
    const f=e.over?1:Math.max(0,Math.min(1,(now()-r.startAt)*.06-e.tick));x=sim.px+(e.x-sim.px)*f;y=sim.py+(e.y-sim.py)*f;al=e.alive;
    if(now()<r.startAt){x=500;y=500}}
  else{const p=Math.sin(performance.now()/300)*4;A.halo.setAttribute('r',62+p)}
  HIST.push([x,y]);if(HIST.length>18)HIST.shift();
  A.trail.forEach((c,j)=>{const h=HIST[HIST.length-18+j]||HIST[0];c.setAttribute('cx',h[0]);c.setAttribute('cy',h[1])});
  A.halo.setAttribute('cx',x);A.halo.setAttribute('cy',y);A.core.setAttribute('cx',x);A.core.setAttribute('cy',y);
  if(al){const k=al.join();if(k!==A.ak){A.ak=k;A.segs.forEach((s,i)=>{s.setAttribute('stroke',al[i]?COL[i%10]:'#2a2f3b');s.setAttribute('opacity',al[i]?1:.7)})}}
  for(let i=PT.length-1;i>=0;i--){const p=PT[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.96;p.vy*=.96;p.l-=.025;if(p.l<=0){p.c.remove();PT.splice(i,1);continue}p.c.setAttribute('cx',p.x);p.c.setAttribute('cy',p.y);p.c.setAttribute('r',p.r*Math.min(1,p.l)+1);p.c.setAttribute('opacity',Math.min(1,p.l))}
  if(SH>.3){A.world.setAttribute('transform',`translate(${((Math.random()-.5)*SH).toFixed(1)} ${((Math.random()-.5)*SH).toFixed(1)})`);SH*=.88}else if(SH){SH=0;A.world.removeAttribute('transform')}
  if(ovKey(r)!==S.ovk)upBattle();
  if(r.status==='COUNTDOWN'&&r.finishAt&&now()>r.finishAt+300&&now()>S.settleAt){S.settleAt=now()+4000;call('settleMatch',{room:r.id}).catch(()=>{})}
}
function openBattle(id){if(roomUn)roomUn();S.rid=id;S.room=null;S.done=false;S.ovk='';sim=null;A=null;PT=[];HIST=[];
  const b=$('#battle');b.hidden=false;b.scrollTop=0;b.innerHTML='<div class="gate"><div class="spin"></div></div>';chrome();
  roomUn=onSnapshot(doc(db,'rooms',id),s=>{if(S.rid!==id)return;
    if(!s.exists()){if(s.metadata&&s.metadata.fromCache)return;toast('Арена закрыта');return closeBattle()}
    const r={id:s.id,...s.data()},first=!A;S.room=r;
    if(first){buildBattle(r);cancelAnimationFrame(raf);frame()}else upBattle();
    if(r.status==='FINISHED'&&!S.done){S.done=true;const w=r.players[r.winner];if(w&&w.uid===UID){confetti();note('success')}else note('warning')}
    if(r.status==='CANCELLED'){if(!S.leaving)toast('Арена закрыта, ставка возвращена');closeBattle()}},
   e=>{if(S.rid!==id||S.leaving)return;toast('Нет доступа к арене','err');closeBattle()})}
function buildBattle(r){const b=$('#battle');
  b.innerHTML=`<div class="bhead"><button class="ibtn bback" data-a="back" aria-label="Назад">${ic('back')}</button><div class="gr"><h1>Арена ${esc(r.id)}</h1><small id="bs"></small></div><button class="ibtn" data-a="invite" aria-label="Пригласить">${ic('share')}</button></div>
  <div class="board">${arenaSvg(r.max)}<div id="ov"></div></div>
  <div class="sec" style="margin-top:16px"><div class="cell"><span class="gr"><span class="t">Призовой фонд</span></span><b class="v pos" id="pp"></b></div></div>
  <div class="sh">Игроки</div><div class="sec ins" id="pl"></div><div id="ctl"></div>`;
  const q=s=>$(s,b);A={world:q('#world'),halo:q('#halo'),core:q('#core'),fx:q('#fxg'),trail:[...q('#trail').children],segs:[...q('#segs').children],ak:''};upBattle()}
function upBattle(){const r=S.room;if(!r||!A)return;
  const ph=phase(r),mp=r.players.find(p=>p.uid===UID),al=sim&&sim.eng.alive,hp=sim&&sim.eng.hp,run=ph==='GO'||ph==='RUNNING'||r.status==='FINISHED';
  $('#bs').innerHTML=`${ST[ph][0]} · ${r.players.length}/${r.max} · ставка ${M(r.stake)}`;
  $('#pp').innerHTML=M(Math.floor(r.stake*r.max*(1-CFG.FEE)));
  $('#pl').innerHTML=Array.from({length:r.max},(_,i)=>{const p=r.players[i];
    if(!p)return`<div class="cell"><span class="av" style="width:40px;height:40px;border:2px dashed ${COL[i%10]};opacity:.6"></span><span class="gr"><span class="t mu">Ждём игрока…</span></span></div>`;
    const dead=run&&al&&al[i]===false,left=run&&hp?hp[i]:null,cr=r.creator&&r.creator.uid===p.uid;
    const sub=run&&left!=null&&!dead?`<span class="hp" style="color:${COL[i%10]}">${'●'.repeat(left)}${'○'.repeat(Math.max(0,3-left))}</span>`:[p.uid===UID?'Вы':'',cr?'создатель':''].filter(Boolean).join(' · ');
    const tag=r.status==='FINISHED'&&r.winner===i?'<span class="badge g">Победитель</span>':dead?'<span class="badge">Выбыл</span>':run?'':`<span class="badge ${p.ready?'g':''}">${p.ready?'Готов':'Не готов'}</span>`;
    return`<div class="cell ${dead?'dead':''}">${av(p,i)}<span class="gr"><span class="t">${esc(p.name)}</span>${sub?`<span class="s">${sub}</span>`:''}</span>${tag}</div>`}).join('');
  const cnt=ph==='COUNT'?Math.ceil((r.startAt-now())/1000):'';let ov='';
  if(ph==='WAITING')ov=`<div class="t">Ждём игроков ${r.players.length}/${r.max}</div>`;else if(ph==='READY')ov='<div class="t">Все готовы</div>';else if(ph==='COUNT')ov=`<div class="n">${cnt}</div>`;else if(ph==='GO')ov='<div class="t">Матч начался</div>';
  else if(ph==='FINISHED'){const w=r.players[r.winner],you=w&&w.uid===UID;ov=`<div class="w"><small>Победитель</small><h3>${w?esc(w.name):'—'}</h3><b class="${you?'pos':''}">${you?'+'+M(r.prize):'Вы проиграли'}</b></div>`}
  $('#ov').innerHTML=ov;S.ovk=ovKey(r);
  $('#ctl').innerHTML=ph==='WAITING'&&mp?`<div class="sec" style="margin-top:16px"><button class="cell tap dest" data-a="leave">${ic('out')}<span class="t">Выйти из арены</span></button></div><p class="sf">Ставка вернётся на баланс. Матч стартует, когда все места заняты и все игроки нажмут «Готов».</p>`:'';
  chrome()}
function closeBattle(){if(roomUn)roomUn();roomUn=null;cancelAnimationFrame(raf);S.rid=null;S.room=null;sim=null;A=null;PT=[];const b=$('#battle');b.hidden=true;b.innerHTML='';ui()}

/* ---------- Действия ---------- */
async function run(f){if(busy)return;busy=true;chrome();try{await f()}catch(e){console.warn(e);note('error');toast(errMsg(e),'err')}finally{busy=false;chrome()}}
const joinRoom=v=>run(async()=>{const r=await call('joinRoom',{room:v});S.code='';hap('medium');S.sub='';openBattle(r.id)});
function inviteJoin(code){if(mine().some(r=>r.id===code))return openBattle(code);const r=S.rooms.find(r=>r.id===code);
  ask('Приглашение в арену',`Присоединиться к арене ${code}${r?` со ставкой ${fmt(r.stake)} ⭐`:''}? Ставка будет списана с баланса.`,'Войти',false,()=>joinRoom(code))}
function act(a,d){const v=d&&d.v;
  try{const ae=document.activeElement;if(ae&&ae.tagName==='INPUT')ae.blur()}catch(e){}
  switch(a){
  case'tab':if(S.tab!==v||S.sub){S.tab=v;S.sub='';sel();ui(true)}break;
  case'newroom':S.sub='create';hap();ui(true);break;
  case'filter':S.filter=+v;sel();ui();break;case'stake':S.cf.stake=+v;sel();ui();break;case'max':S.cf.max=+v;sel();ui();break;case'priv':S.cf.priv=v==='1';sel();ui();break;
  case'wtab':S.wt=v;sel();ui();break;case'lbt':S.lbt=v;sel();ui();break;case'dep':S.dep=+v;sel();ui();break;
  case'main':mainClick();break;
  case'retry':hap();boot();break;
  case'open':hap();openBattle(v);break;
  case'play':{const m=mine()[0];if(m){openBattle(m.id);break}
    const r=S.rooms.filter(r=>r.status==='WAITING'&&r.players.length<r.max&&r.stake<=stars()).sort((a,b)=>b.players.length-a.players.length)[0];
    if(r)ask('Играть?',`Войти в арену ${r.id} со ставкой ${fmt(r.stake)} ⭐? Ставка будет списана сразу.`,'Играть',false,()=>joinRoom(r.id));
    else{S.sub='create';ui(true);toast('Подходящих арен нет — создайте свою')}break}
  case'join':hap();joinRoom(v);break;
  case'code':{const c=($('#code').value||'').trim().toUpperCase();if(!c){toast('Введите код арены','err');break}if(mine().some(r=>r.id===c))openBattle(c);else joinRoom(c);break}
  case'create':run(async()=>{const r=await call('createRoom',S.cf);note('success');S.sub='';openBattle(r.id)});break;
  case'deposit':run(async()=>{const{link}=await call('createInvoice',{amount:S.dep});if(!tg||!tg.openInvoice)return toast('Оплата доступна только в Telegram','err');
    tg.openInvoice(link,st=>{if(st==='paid'){note('success');toast('Оплачено — баланс обновится через несколько секунд')}else if(st==='cancelled')toast('Платёж отменён');else if(st==='failed'){note('error');toast('Ошибка оплаты','err')}})});break;
  case'ready':{const m=S.room&&S.room.players.find(p=>p.uid===UID);if(!m)break;hap();run(()=>call('setReady',{room:S.rid,ready:!m.ready}));break}
  case'leave':ask('Выйти из арены?','Ставка вернётся на ваш баланс.','Выйти',true,()=>run(async()=>{S.leaving=true;try{await call('leaveRoom',{room:S.rid});note('success');closeBattle();toast('Ставка возвращена')}finally{S.leaving=false}}));break;
  case'back':if(S.rid)closeBattle();else if(S.sub){S.sub='';ui(true)}break;
  case'again':closeBattle();S.tab='lobby';S.sub='';ui(true);break;
  case'invite':{const id=S.rid;if(!id)break;
    if(tg&&CFG.APP_LINK&&tg.openTelegramLink)tg.openTelegramLink('https://t.me/share/url?url='+encodeURIComponent(CFG.APP_LINK+'?startapp='+id)+'&text='+encodeURIComponent('Заходи на арену UPARENA'));
    else copy(id).then(()=>toast('Код арены скопирован: '+id));break}
  }}
document.addEventListener('click',e=>{
  const c=e.target.closest('[data-copy]');if(c){const el=document.getElementById(c.dataset.copy);if(el)copy(el.textContent).then(()=>toast('Скопировано'));return}
  const t=e.target.closest('[data-a]');if(t)act(t.dataset.a,t.dataset)});
document.addEventListener('input',e=>{if(e.target.id==='code')S.code=e.target.value});

/* ---------- Запуск ---------- */
document.body.classList.toggle('nobb',!(tg&&tg.BackButton));
try{if(tg){tg.ready();tg.expand();theme();tg.onEvent('themeChanged',theme);if(ver('7.7'))tg.disableVerticalSwipes();
  if(tg.BackButton)tg.BackButton.onClick(()=>act('back',{}));if(tg.MainButton)tg.MainButton.onClick(mainClick)}}catch(e){}
boot();
</script>
</body>
