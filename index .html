<style>
:root{--bg:#080910;--p:#8B5CF6;--s:#6366F1;--a:#22D3EE;--ok:#22C55E;--g:rgba(255,255,255,.05);--b:rgba(255,255,255,.1);--tx:#EEF0FF;--mu:#8D90B0;--gold:#FBBF24;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}

button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}

input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--b);background:var(--g);color:var(--tx);font:inherit;outline:0}input:focus{border-color:var(--a)}

.bh{display:flex;align-items:center;gap:10px}.bh>div{flex:1}.ic{width:38px;height:38px;border-radius:12px;border:1px solid var(--b);background:var(--g);display:grid;place-items:center}

#ov .n{font:800 120px 'Exo 2';color:#fff;text-shadow:0 0 40px var(--a),0 0 80px var(--p);animation:pop 1s ease-out infinite}

.dead{opacity:.4;text-decoration:line-through}
#toast{position:fixed;left:50%;top:calc(var(--sat) + 60px);transform:translate(-50%,-20px);opacity:0;z-index:50;padding:10px 16px;border-radius:12px;background:rgba(20,22,40,.94);border:1px solid var(--p);transition:.3s;pointer-events:none;max-width:88%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

<div id="app">
  <header>
    <div class="logo"><svg width="24" height="24" viewBox="0 0 24 24"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient></defs><path d="M12 1.5l9 5.2v10.6l-9 5.2-9-5.2V6.7z" fill="none" stroke="url(#lg)" stroke-width="1.8"/><path d="M13 6l-4 6h3l-1 6 4-6h-3z" fill="url(#lg)"/></svg>UPARENA</div>

<script type="text/plain" id="src-functions">/* UPARENA — серверная часть (Firebase Cloud Functions v2, Node 20).
   Сервер — единственный источник истины: баланс, ставки, старт и результат матча.
   Деплой: firebase deploy --only functions,firestore:rules
   Секреты: firebase functions:secrets:set BOT_TOKEN ; firebase functions:secrets:set WEBHOOK_SECRET */
const { onCall, onRequest, HttpsError } = require('firebase-functions/v2/https');
const { onSchedule } = require('firebase-functions/v2/scheduler');
const { defineSecret } = require('firebase-functions/params');
const admin = require('firebase-admin');
const crypto = require('crypto');

admin.initializeApp();
const db = admin.firestore(), FV = admin.firestore.FieldValue;
const BOT = defineSecret('BOT_TOKEN'), HOOK = defineSecret('WEBHOOK_SECRET');
const FEE = 0.05, STAKES = [10, 50, 100, 250, 500, 1000], MAXP = [2, 4, 6, 8, 10], DEPS = [50, 100, 250, 500, 1000];

/* ---- Движок: должен совпадать с клиентским байт-в-байт по логике ---- */
function mul(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
class Engine {
  constructor(seed, n) {
    this.rng = mul(seed); this.n = n; this.x = 500; this.y = 500; this.sp = 340; this.tick = 0; this.alive = Array(n).fill(true); this.hp = Array(n).fill(3); this.over = false; this.winner = -1; this.ev = [];
    let a = this.rng() * 2 - 1, b = this.rng() * 2 - 1; if (Math.abs(a) + Math.abs(b) < .3) a = 1; this.dir(a, b);
  }
  dir(a, b) { const l = Math.sqrt(a * a + b * b); this.vx = a / l * this.sp; this.vy = b / l * this.sp; }
  hit(p, x, y) {
    const o = Math.min(this.n - 1, Math.floor(p / (4000 / this.n))); this.sp = Math.min(1100, this.sp * 1.05);
    const k = (this.rng() - .5) * .14; this.dir(this.vx - k * this.vy, this.vy + k * this.vx);
    const kill = this.alive[o] && --this.hp[o] <= 0; this.ev.push({ x, y, o, p: this.sp / 1100, kill });
    if (kill) { this.alive[o] = false; if (this.alive.filter(Boolean).length <= 1) { this.over = true; this.winner = this.alive.indexOf(true); } }
  }
  step() {
    if (this.over) return; this.tick++; const dt = 1 / 60, r = 16, W = 1000; this.x += this.vx * dt; this.y += this.vy * dt;
    if (this.y < r) { this.y = r; this.vy = Math.abs(this.vy); this.hit(this.x, this.x, 0); }
    if (this.x > W - r) { this.x = W - r; this.vx = -Math.abs(this.vx); this.hit(W + this.y, W, this.y); }
    if (this.y > W - r) { this.y = W - r; this.vy = -Math.abs(this.vy); this.hit(2 * W + (W - this.x), this.x, W); }
    if (this.x < r) { this.x = r; this.vx = Math.abs(this.vx); this.hit(3 * W + (W - this.y), 0, this.y); }
  }
}

/* ---- Утилиты ---- */
const fail = (c, m) => { throw new HttpsError(c, m); };
const authed = r => r.auth ? r.auth.uid : fail('unauthenticated', 'Требуется вход');
const wk = () => { const d = new Date(); d.setUTCHours(0, 0, 0, 0); d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7)); const y = d.getUTCFullYear(); return y + '-W' + Math.ceil(((d - Date.UTC(y, 0, 1)) / 864e5 + 1) / 7); };
const addTx = (t, uid, type, amount, room) => t.set(db.collection(`users/${uid}/tx`).doc(), { type, amount, room: room || null, ts: FV.serverTimestamp() });
// Идемпотентность: повтор запроса с тем же rid возвращает прежний результат и не списывает дважды
function idem(uid, rid, fn) {
  if (typeof rid !== 'string' || rid.length < 8 || rid.length > 64 || rid.includes('/')) fail('invalid-argument', 'Нет идентификатора запроса');
  const k = db.doc(`requests/${uid}_${rid}`);
  return db.runTransaction(async t => { const s = await t.get(k); if (s.exists) return s.data().res; const res = await fn(t); t.set(k, { res, ts: FV.serverTimestamp() }); return res; });
}
function verify(init, token) {
  const p = new URLSearchParams(init), h = p.get('hash'); p.delete('hash');
  const s = [...p.entries()].map(([k, v]) => k + '=' + v).sort().join('\n');
  const key = crypto.createHmac('sha256', 'WebAppData').update(token).digest(), c = crypto.createHmac('sha256', key).update(s).digest('hex');
  if (!h || h.length !== c.length || !crypto.timingSafeEqual(Buffer.from(c), Buffer.from(h))) return null;
  if (Date.now() / 1000 - Number(p.get('auth_date')) > 86400) return null;
  try { return JSON.parse(p.get('user')); } catch (e) { return null; }
}

/* ---- Вход через Telegram ---- */
exports.telegramAuth = onCall({ secrets: [BOT] }, async req => {
  const u = verify(String(req.data.initData || ''), BOT.value()); if (!u) fail('unauthenticated', 'Неверная подпись Telegram');
  const uid = 'tg' + u.id, ref = db.doc('users/' + uid), name = u.username ? '@' + u.username : (u.first_name || 'Игрок'), s = await ref.get();
  if (!s.exists) await ref.create({ name, photo: u.photo_url || '', stars: 0, games: 0, wins: 0, losses: 0, earned: 0, createdAt: FV.serverTimestamp() }).catch(() => {});
  else await ref.update({ name, photo: u.photo_url || '' });
  return { token: await admin.auth().createCustomToken(uid) };
});
exports.serverTime = onCall(() => ({ t: Date.now() }));

/* ---- Комнаты ---- */
exports.createRoom = onCall(async req => {
  const uid = authed(req), { stake, max, priv, rid } = req.data;
  if (!STAKES.includes(stake) || !MAXP.includes(max)) fail('invalid-argument', 'Неверные параметры комнаты');
  return idem(uid, rid, async t => {
    const us = await t.get(db.doc('users/' + uid)), u = us.data(); if (!u || u.stars < stake) fail('failed-precondition', 'Недостаточно звёзд');
    const id = crypto.randomBytes(3).toString('hex').toUpperCase();
    t.create(db.doc('rooms/' + id), { creator: { uid, name: u.name }, stake, max, priv: !!priv, status: 'WAITING', players: [{ uid, name: u.name, photo: u.photo || '', ready: false }], playerUids: [uid], createdAt: FV.serverTimestamp() });
    t.update(us.ref, { stars: FV.increment(-stake) }); addTx(t, uid, 'bet', -stake, id); return { id };
  });
});
exports.joinRoom = onCall(async req => {
  const uid = authed(req), id = String(req.data.room || '').toUpperCase();
  if (!/^[A-Z0-9]{4,12}$/.test(id)) fail('invalid-argument', 'Неверный код комнаты');
  return idem(uid, req.data.rid, async t => {
    const rr = db.doc('rooms/' + id), [rs, us] = await Promise.all([t.get(rr), t.get(db.doc('users/' + uid))]);
    if (!rs.exists) fail('not-found', 'Комната не найдена'); const r = rs.data(), u = us.data();
    if (r.playerUids.includes(uid)) return { id };
    if (r.status !== 'WAITING') fail('failed-precondition', 'Комната недоступна');
    if (r.players.length >= r.max) fail('failed-precondition', 'Комната заполнена');
    if (!u || u.stars < r.stake) fail('failed-precondition', 'Недостаточно звёзд');
    t.update(rr, { players: FV.arrayUnion({ uid, name: u.name, photo: u.photo || '', ready: false }), playerUids: FV.arrayUnion(uid) });
    t.update(us.ref, { stars: FV.increment(-r.stake) }); addTx(t, uid, 'bet', -r.stake, id); return { id };
  });
});
exports.setReady = onCall(async req => {
  const uid = authed(req);
  return idem(uid, req.data.rid, async t => {
    const rr = db.doc('rooms/' + String(req.data.room || '')), rs = await t.get(rr); if (!rs.exists) fail('not-found', 'Комната не найдена');
    const r = rs.data(), i = r.players.findIndex(p => p.uid === uid);
    if (r.status !== 'WAITING') fail('failed-precondition', 'Готовность изменить нельзя'); if (i < 0) fail('permission-denied', 'Вы не в этой комнате');
    const players = r.players.map((p, j) => j === i ? { ...p, ready: !!req.data.ready } : p), upd = { players };
    if (players.length === r.max && players.every(p => p.ready)) {
      // Старт: сервер выбирает seed, заранее просчитывает исход и пишет его в закрытый документ
      const seed = crypto.randomInt(1, 2147483647), e = new Engine(seed, r.max); while (!e.over && e.tick < 600000) e.step();
      if (!e.over) fail('internal', 'Не удалось просчитать матч');
      const startAt = Date.now() + 4500;
      Object.assign(upd, { status: 'COUNTDOWN', seed, startAt, finishAt: startAt + Math.ceil(e.tick * 1000 / 60) });
      t.set(rr.collection('secret').doc('result'), { winner: e.winner, ticks: e.tick });
    }
    t.update(rr, upd); return { ok: true };
  });
});
exports.leaveRoom = onCall(async req => {
  const uid = authed(req);
  return idem(uid, req.data.rid, async t => {
    const rr = db.doc('rooms/' + String(req.data.room || '')), rs = await t.get(rr); if (!rs.exists) return { ok: true };
    const r = rs.data(); if (r.status !== 'WAITING') fail('failed-precondition', 'Матч уже начался'); if (!r.playerUids.includes(uid)) return { ok: true };
    const players = r.players.filter(p => p.uid !== uid);
    t.update(rr, { players, playerUids: FV.arrayRemove(uid), ...(players.length ? {} : { status: 'CANCELLED' }) });
    t.update(db.doc('users/' + uid), { stars: FV.increment(r.stake) }); addTx(t, uid, 'refund', r.stake, rs.id); return { ok: true };
  });
});

/* ---- Расчёт матча: победителя определяет только сервер ---- */
async function settle(id) {
  return db.runTransaction(async t => {
    const rr = db.doc('rooms/' + id), rs = await t.get(rr); if (!rs.exists) return { ok: false };
    const r = rs.data(); if (r.status === 'FINISHED') return { ok: true }; if (r.status !== 'COUNTDOWN') return { ok: false };
    if (Date.now() < r.finishAt) return { early: true };
    const sec = await t.get(rr.collection('secret').doc('result')), w = sec.data().winner;
    const lbs = await Promise.all(r.players.map(p => t.get(db.doc('leaderboard/' + p.uid))));
    const pool = r.stake * r.max, prize = Math.floor(pool * (1 - FEE)), k = wk();
    r.players.forEach((p, i) => {
      const win = i === w, net = win ? prize - r.stake : -r.stake, old = lbs[i].data() || {}, same = old.weekKey === k;
      t.update(db.doc('users/' + p.uid), { games: FV.increment(1), wins: FV.increment(win ? 1 : 0), losses: FV.increment(win ? 0 : 1), earned: FV.increment(net), ...(win ? { stars: FV.increment(prize) } : {}) });
      if (win) addTx(t, p.uid, 'win', prize, id);
      t.set(db.doc('leaderboard/' + p.uid), { name: p.name, photo: p.photo || '', games: (old.games || 0) + 1, wins: (old.wins || 0) + (win ? 1 : 0), earned: (old.earned || 0) + net, weekKey: k, weekEarned: (same ? old.weekEarned || 0 : 0) + net, weekWins: (same ? old.weekWins || 0 : 0) + (win ? 1 : 0) });
    });
    t.set(db.doc('matches/' + id), { room: id, winnerUid: r.players[w].uid, winnerName: r.players[w].name, prize, stake: r.stake, players: r.players.length, finishedAt: FV.serverTimestamp() });
    t.set(db.doc('platform/stats'), { fees: FV.increment(pool - prize) }, { merge: true });
    t.update(rr, { status: 'FINISHED', winner: w, prize }); return { ok: true };
  });
}
exports.settleMatch = onCall(async req => { authed(req); return settle(String(req.data.room || '')); });
exports.sweep = onSchedule('every 1 minutes', async () => {
  const s = await db.collection('rooms').where('status', '==', 'COUNTDOWN').get();

exports.createInvoice = onCall({ secrets: [BOT] }, async req => {
  const uid = authed(req), a = req.data.amount; if (!DEPS.includes(a)) fail('invalid-argument', 'Неверная сумма');
  const j = await fetch(`https://api.telegram.org/bot${BOT.value()}/createInvoiceLink`, { method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ title: 'UPARENA Stars', description: `Пополнение баланса на ${a} Stars`, payload: JSON.stringify({ uid, a }), provider_token: '', currency: 'XTR', prices: [{ label: 'Stars', amount: a }] }) }).then(r => r.json());
  if (!j.ok) fail('internal', 'Не удалось создать счёт'); return { link: j.result };
});
// setWebhook: url=<функция tgWebhook>, secret_token=<WEBHOOK_SECRET>, allowed_updates=["pre_checkout_query","message"]
exports.tgWebhook = onRequest({ secrets: [BOT, HOOK] }, async (req, res) => {
  if (req.get('x-telegram-bot-api-secret-token') !== HOOK.value()) return res.status(403).send('forbidden');
  const u = req.body || {}, api = (m, b) => fetch(`https://api.telegram.org/bot${BOT.value()}/${m}`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(b) });
  const parse = s => { try { return JSON.parse(s); } catch (e) { return null; } };
  try {
    if (u.pre_checkout_query) {
      const q = u.pre_checkout_query, p = parse(q.invoice_payload), ok = !!p && q.currency === 'XTR' && DEPS.includes(p.a) && q.total_amount === p.a && p.uid === 'tg' + q.from.id;
      await api('answerPreCheckoutQuery', { pre_checkout_query_id: q.id, ok, ...(ok ? {} : { error_message: 'Неверный платёж' }) });
    }
    const sp = u.message && u.message.successful_payment;
    if (sp) {
      const p = parse(sp.invoice_payload);
      if (p && sp.currency === 'XTR' && DEPS.includes(p.a) && sp.total_amount === p.a && p.uid === 'tg' + u.message.from.id)
        await db.runTransaction(async t => {
          const pr = db.doc('payments/' + sp.telegram_payment_charge_id); if ((await t.get(pr)).exists) return; // повторная доставка вебхука
          t.create(pr, { uid: p.uid, amount: p.a, ts: FV.serverTimestamp() }); t.update(db.doc('users/' + p.uid), { stars: FV.increment(p.a) }); addTx(t, p.uid, 'deposit', p.a);
        });
    }
  } catch (e) { console.error(e); return res.status(500).send('error'); }
  res.send('ok');
});

<script type="text/plain" id="src-rules">rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    function signedIn() { return request.auth != null; }

    // Баланс и профиль: только владелец читает, писать может лишь сервер (Admin SDK обходит правила)
    match /users/{uid} {
      allow read: if signedIn() && request.auth.uid == uid;
      allow write: if false;
      match /tx/{txId} {
        allow read: if signedIn() && request.auth.uid == uid;
        allow write: if false;
      }
    }

    // Публичные комнаты видны всем вошедшим, приватные — только участникам.
    // Запрос в клиенте обязан содержать where('priv','==',false).
    match /rooms/{roomId} {
      allow read: if signedIn() && (resource.data.priv == false || request.auth.uid in resource.data.playerUids);
      allow write: if false;
      match /secret/{doc} { allow read, write: if false; }
    }

    match /matches/{id}     { allow read: if signedIn(); allow write: if false; }
    match /leaderboard/{id} { allow read: if signedIn(); allow write: if false; }

    // Всё остальное (requests, payments, platform) закрыто
  }
}
</script>

/* ---------- Детерминированный движок (идентичен серверному) ---------- */
function mul(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
class Engine{
  constructor(seed,n){this.rng=mul(seed);this.n=n;this.x=500;this.y=500;this.sp=340;this.tick=0;this.alive=Array(n).fill(true);this.hp=Array(n).fill(3);this.over=false;this.winner=-1;this.ev=[];
    let a=this.rng()*2-1,b=this.rng()*2-1;if(Math.abs(a)+Math.abs(b)<.3)a=1;this.dir(a,b)}
  dir(a,b){const l=Math.sqrt(a*a+b*b);this.vx=a/l*this.sp;this.vy=b/l*this.sp}
  hit(p,x,y){const o=Math.min(this.n-1,Math.floor(p/(4000/this.n)));this.sp=Math.min(1100,this.sp*1.05);const k=(this.rng()-.5)*.14;this.dir(this.vx-k*this.vy,this.vy+k*this.vx);
    const kill=this.alive[o]&&--this.hp[o]<=0;this.ev.push({x,y,o,p:this.sp/1100,kill});
    if(kill){this.alive[o]=false;if(this.alive.filter(Boolean).length<=1){this.over=true;this.winner=this.alive.indexOf(true)}}}
  step(){if(this.over)return;this.tick++;const dt=1/60,r=16,W=1000;this.x+=this.vx*dt;this.y+=this.vy*dt;
    if(this.y<r){this.y=r;this.vy=Math.abs(this.vy);this.hit(this.x,this.x,0)}
    if(this.x>W-r){this.x=W-r;this.vx=-Math.abs(this.vx);this.hit(W+this.y,W,this.y)}
    if(this.y>W-r){this.y=W-r;this.vy=-Math.abs(this.vy);this.hit(2*W+(W-this.x),this.x,W)}
    if(this.x<r){this.x=r;this.vx=Math.abs(this.vx);this.hit(3*W+(W-this.y),0,this.y)}}
}

  if(S.rid&&S.room)upBattle()}

/* ---------- Арена (SVG) ---------- */
function pt(p){const W=1000,i=8,c=v=>Math.min(W-i,Math.max(i,v));p=((p%4000)+4000)%4000;return p<W?[c(p),i]:p<2*W?[W-i,c(p-W)]:p<3*W?[c(W-(p-2*W)),W-i]:[i,c(W-(p-3*W))]}
function segD(i,L){const a=i*L,b=(i+1)*L,P=[pt(a)];for(let k=1;k<4;k++)if(k*1000>a&&k*1000<b)P.push(pt(k*1000));P.push(pt(b-.01));return P.map((q,j)=>(j?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join('')}
function arenaSvg(n){const L=4000/n;let sg='',tr='',gr='';for(let i=0;i<n;i++)sg+=`<path d="${segD(i,L)}" fill="none" stroke="${COL[i%10]}" stroke-width="14"/>`;
  for(let j=0;j<18;j++)tr+=`<circle r="${(3+j*.8).toFixed(1)}" cx="500" cy="500" fill="#22D3EE" opacity="${(j/18*.35).toFixed(2)}"/>`;for(let i=1;i<10;i++)gr+=`M${i*100} 0V1000M0 ${i*100}H1000`;
  return`<svg id="arena" viewBox="0 0 1000 1000" role="img" aria-label="Игровая арена"><defs><radialGradient id="hg"><stop offset="0" stop-color="#fff"/><stop offset=".25" stop-color="#22D3EE" stop-opacity=".9"/><stop offset=".6" stop-color="#8B5CF6" stop-opacity=".35"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient><filter id="gl" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><g id="world"><rect width="1000" height="1000" fill="#0b0c18"/><path d="${gr}" stroke="rgba(255,255,255,.05)" stroke-width="1.5" fill="none"/><g id="segs" filter="url(#gl)">${sg}</g><g id="trail">${tr}</g><g id="fxg"></g><circle id="halo" r="62" cx="500" cy="500" fill="url(#hg)"/><circle id="core" r="13" cx="500" cy="500" fill="#fff"/></g></svg>`}
function fxBurst(e){if(!A)return;const n=10+Math.round(e.p*24);for(let i=0;i<n&&PT.length<220;i++){const a=Math.random()*6.283,s=2+Math.random()*(4+e.p*8),c=document.createElementNS(NS,'circle');c.setAttribute('fill',Math.random()<.5?COL[e.o%10]:'#fff');A.fx.appendChild(c);PT.push({c,x:e.x,y:e.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,r:3+Math.random()*5})}
  if(e.p>.45||e.kill){SH=Math.max(SH,6+e.p*10);hap(e.kill?'heavy':'light')}}
function confetti(){if(!A)return;for(let i=0;i<90&&PT.length<260;i++){const c=document.createElementNS(NS,'circle');c.setAttribute('fill',COL[i%10]);A.fx.appendChild(c);PT.push({c,x:Math.random()*1000,y:-20,vx:(Math.random()-.5)*3,vy:2+Math.random()*7,l:2.2,r:4+Math.random()*5})}}
function frame(){
  if(!S.rid)return;raf=requestAnimationFrame(frame);const r=S.room;if(!r||!A)return;let x=500,y=500,al=null;
  if(r.seed){if(!sim||sim.seed!==r.seed)sim={seed:r.seed,eng:new Engine(r.seed,r.max),px:500,py:500};
    const e=sim.eng,target=r.status==='FINISHED'?1e9:Math.floor((now()-r.startAt)*.06),lag=target-e.tick;let k=0;
    while(e.tick<target&&!e.over&&k++<20000){sim.px=e.x;sim.py=e.y;e.step();const ev=e.ev.splice(0);if(lag<30)ev.forEach(fxBurst)}
    const f=e.over?1:Math.max(0,Math.min(1,(now()-r.startAt)*.06-e.tick));x=sim.px+(e.x-sim.px)*f;y=sim.py+(e.y-sim.py)*f;al=e.alive;
    if(now()<r.startAt){x=500;y=500}}
  else{const p=Math.sin(performance.now()/300)*4;A.halo.setAttribute('r',62+p)}
  HIST.push([x,y]);if(HIST.length>18)HIST.shift();
  A.trail.forEach((c,j)=>{const h=HIST[HIST.length-18+j]||HIST[0];c.setAttribute('cx',h[0]);c.setAttribute('cy',h[1])});
  A.halo.setAttribute('cx',x);A.halo.setAttribute('cy',y);A.core.setAttribute('cx',x);A.core.setAttribute('cy',y);
  if(al){const k=al.join();if(k!==A.ak){A.ak=k;A.segs.forEach((s,i)=>{s.setAttribute('stroke',al[i]?COL[i%10]:'#2a2c3e');s.setAttribute('opacity',al[i]?1:.7)})}}
  for(let i=PT.length-1;i>=0;i--){const p=PT[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.96;p.vy*=.96;p.l-=.025;if(p.l<=0){p.c.remove();PT.splice(i,1);continue}p.c.setAttribute('cx',p.x);p.c.setAttribute('cy',p.y);p.c.setAttribute('r',p.r*Math.min(1,p.l)+1);p.c.setAttribute('opacity',Math.min(1,p.l))}
  if(SH>.3){A.world.setAttribute('transform',`translate(${((Math.random()-.5)*SH).toFixed(1)} ${((Math.random()-.5)*SH).toFixed(1)})`);SH*=.88}else if(SH){SH=0;A.world.removeAttribute('transform')}
  const ph=phase(r),key=ph+(ph==='COUNT'?Math.ceil((r.startAt-now())/1000):'')+r.status+r.players.length;if(key!==S.ovk)upBattle();
  if(r.status==='COUNTDOWN'&&r.finishAt&&now()>r.finishAt+300&&now()>S.settleAt){S.settleAt=now()+4000;call('settleMatch',{room:r.id}).catch(()=>{})}
}
function openBattle(id){if(roomUn)roomUn();S.rid=id;S.room=null;S.done=false;sim=null;A=null;PT=[];HIST=[];$('#battle').hidden=false;$('#battle').innerHTML='';
  roomUn=onSnapshot(doc(db,'rooms',id),s=>{if(!s.exists()||S.rid!==id){return closeBattle()}const r={id:s.id,...s.data()};const first=!S.room;S.room=r;
    if(first||!A){buildBattle(r);cancelAnimationFrame(raf);frame()}else upBattle();
    if(r.status==='FINISHED'&&!S.done){S.done=true;const w=r.players[r.winner];if(w&&w.uid===UID){confetti();hap('heavy')}}
    if(r.status==='CANCELLED')closeBattle()},e=>{toast('Нет доступа к комнате');closeBattle()})}
function buildBattle(r){const b=$('#battle');
  b.innerHTML=`<div class="bh"><button class="ic" data-a="back" aria-label="Назад">${ic('back')}</button><div><h3>Арена ${esc(r.id)}</h3><small class="mu" id="bs"></small></div><button class="ic" data-a="invite" aria-label="Пригласить">${ic('share')}</button></div>
  <div class="cvw glass">${arenaSvg(r.max)}<div id="ov"></div></div><div class="glass card row sp"><span class="mu">Призовой фонд</span><b class="pos" id="pp"></b></div><div class="glass" id="pl"></div><div id="ctl" class="row"></div>`;
  const q=s=>$(s,b);A={world:q('#world'),halo:q('#halo'),core:q('#core'),fx:q('#fxg'),trail:[...q('#trail').children],segs:[...q('#segs').children],ak:''};upBattle()}
function upBattle(){const r=S.room;if(!r||!A)return;const ph=phase(r),mine=r.players.find(p=>p.uid===UID),al=sim&&sim.eng.alive,run=ph==='GO'||ph==='RUNNING'||r.status==='FINISHED';
  $('#bs').textContent=`${ST[ph][0]} · ${r.players.length}/${r.max} · ставка ${fmt(r.stake)} Stars`;$('#pp').innerHTML=M(Math.floor(r.stake*r.max*(1-CFG.FEE)));
  $('#pl').innerHTML=Array.from({length:r.max},(_,i)=>{const p=r.players[i];if(!p)return`<div class="li mu">${av({name:'?'},i)}Ждём игрока…</div>`;const dead=run&&al&&al[i]===false;
    return`<div class="li ${dead?'dead':''}">${av(p,i)}<div class="gr"><b>${esc(p.name)}</b><small class="mu">ID ${esc(p.uid)}</small></div>${r.status==='FINISHED'&&r.winner===i?'<span class="badge g">Победитель</span>':dead?'<span class="badge">Выбыл</span>':`<span class="badge ${p.ready?'g':''}">${p.ready?'Ready':'Не готов'}</span>`}</div>`}).join('');
  let ov='',cnt=ph==='COUNT'?Math.ceil((r.startAt-now())/1000):'';
  if(ph==='WAITING')ov=`<div class="t">Ожидание игроков ${r.players.length}/${r.max}</div>`;else if(ph==='READY')ov='<div class="t">Все готовы</div>';else if(ph==='COUNT')ov=`<div class="n">${cnt}</div>`;else if(ph==='GO')ov='<div class="t">Матч начался</div>';
  else if(ph==='FINISHED'){const w=r.players[r.winner],you=w&&w.uid===UID;ov=`<div class="w"><div class="mu">Победитель</div><h3 style="font-size:24px;margin:4px 0">${w?esc(w.name):'—'}</h3><b class="${you?'pos':'mu'}">${you?'+'+M(r.prize):'Вы проиграли'}</b></div>`}
  $('#ov').innerHTML=ov;S.ovk=ph+cnt+r.status+r.players.length;
  $('#ctl').innerHTML=ph==='FINISHED'?'<button class="btn w" data-a="again">Играть снова</button>':ph==='WAITING'?`<button class="btn ${mine&&mine.ready?'gh':'ok'}" style="flex:2" data-a="ready">${mine&&mine.ready?'Отменить готовность':'READY'}</button><button class="btn gh" style="flex:1" data-a="leave">Выйти</button>`:''}
function closeBattle(){if(roomUn)roomUn();roomUn=null;cancelAnimationFrame(raf);S.rid=null;S.room=null;sim=null;A=null;$('#battle').hidden=true;$('#battle').innerHTML='';ui()}

/* ---------- Действия ---------- */
async function run(f){if(busy)return;busy=true;try{await f()}catch(e){toast((e&&e.message)||'Ошибка')}finally{busy=false}}
const joinRoom=v=>run(async()=>{const r=await call('joinRoom',{room:v});hap('medium');openBattle(r.id)});
function act(a,d){const v=d.v;hap();
  switch(a){
  case'tab':S.tab=v;$('#view').scrollTop=0;ui();break;
  case'filter':S.filter=+v;ui();break;case'stake':S.cf.stake=+v;ui();break;case'max':S.cf.max=+v;ui();break;case'priv':S.cf.priv=v==='1';ui();break;
  case'wtab':S.wt=v;ui();break;case'lbt':S.lbt=v;ui();break;case'dep':S.dep=+v;ui();break;
  case'play':{const r=S.rooms.find(r=>r.status==='WAITING'&&r.players.length<r.max&&r.stake<=stars()&&!r.players.some(p=>p.uid===UID));if(r)joinRoom(r.id);else{S.tab='create';ui();toast('Подходящих арен нет — создайте свою')}break}
  case'join':joinRoom(v);break;
  case'code':{const c=($('#code').value||'').trim().toUpperCase();c?joinRoom(c):toast('Введите код комнаты');break}
  case'create':run(async()=>{const r=await call('createRoom',S.cf);openBattle(r.id)});break;
  case'deposit':run(async()=>{const{link}=await call('createInvoice',{amount:S.dep});if(!tg||!tg.openInvoice)return toast('Оплата доступна только в Telegram');
    tg.openInvoice(link,st=>toast(st==='paid'?'Оплачено — баланс обновится через несколько секунд':st==='cancelled'?'Платёж отменён':st==='failed'?'Ошибка оплаты':'Ожидание оплаты'))});break;
  case'ready':{const m=S.room.players.find(p=>p.uid===UID);run(()=>call('setReady',{room:S.rid,ready:!(m&&m.ready)}));break}
  case'leave':run(async()=>{await call('leaveRoom',{room:S.rid});closeBattle()});break;
  case'back':{const ph=phase(S.room||{status:'FINISHED'});if(ph==='WAITING')act('leave',d);else if(['COUNT','GO','RUNNING','READY'].includes(ph))toast('Матч уже начался');else closeBattle();break}
  case'again':closeBattle();S.tab='lobby';ui();break;
  case'invite':{const id=S.rid;if(tg&&CFG.APP_LINK)tg.openTelegramLink('https://t.me/share/url?url='+encodeURIComponent(CFG.APP_LINK+'?startapp='+id)+'&text='+encodeURIComponent('Заходи на арену UPARENA'));else{navigator.clipboard&&navigator.clipboard.writeText(id);toast('Код комнаты скопирован: '+id)}break}
  }}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t)act(t.dataset.a,t.dataset)});
boot();
</script>
